aid: yugabyte
name: Yugabyte
description: >-
  Yugabyte is the company behind YugabyteDB, an open source (Apache 2.0),
  PostgreSQL-compatible distributed SQL database built for cloud-native and
  mission-critical applications. It pairs PostgreSQL wire-compatibility (the YSQL
  API) and a Cassandra-inspired API (YCQL) with horizontal scalability, built-in
  resilience, automatic sharding, and automatic failover across multi-region and
  multi-cloud deployments. Yugabyte ships the database in three form factors:
  self-managed YugabyteDB, YugabyteDB Anywhere for private and hybrid clouds, and
  YugabyteDB Aeon, a fully managed database-as-a-service. Developers integrate
  through PostgreSQL-compatible smart drivers, the YugabyteDB Aeon REST management
  API, the open source ybm CLI, a Terraform provider, and the yugabyted local
  admin API.
