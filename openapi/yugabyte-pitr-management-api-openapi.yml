openapi: 3.2.0
info:
  contact:
    name: https://docs.yugabyte.com
  description: ALPHA - NOT FOR EXTERNAL USE
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  termsOfService: TODO(chirag)
  title: YugabyteDB Anywhere PITR management API
  version: v1
servers:
- url: /
tags:
- name: PITR management
paths:
  /api/v1/customers/{cUUID}/universes/{uniUUID}/clone:
    post:
      description: YbaApi Internal.
      operationId: cloneNamespace
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneNamespaceParams'
        description: perform clone via PITR
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Clone namespace via PITR on a universe
      tags:
      - PITR management
      x-codegen-request-body-name: namespaceClone
  /api/v1/customers/{cUUID}/universes/{uniUUID}/keyspaces/{tableType}/{keyspaceName}/pitr_config:
    post:
      operationId: createPitrConfig
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tableType
        required: true
        schema:
          type: string
      - in: path
        name: keyspaceName
        required: true
        schema:
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePitrConfigParams'
        description: post pitr config
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Create pitr config for a keyspace in a universe
      tags:
      - PITR management
      x-codegen-request-body-name: pitrConfig
  /api/v1/customers/{cUUID}/universes/{uniUUID}/pitr:
    post:
      operationId: performPitr
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreSnapshotScheduleParams'
        description: perform PITR
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Perform PITR on a universe
      tags:
      - PITR management
      x-codegen-request-body-name: performPitr
  /api/v1/customers/{cUUID}/universes/{uniUUID}/pitr_config:
    get:
      operationId: ListOfPitrConfigs
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PitrConfig'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List the PITR configs of a universe
      tags:
      - PITR management
  /api/v1/customers/{cUUID}/universes/{uniUUID}/pitr_config/{pUUID}:
    delete:
      operationId: deletePitrConfig
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Delete pitr config on a universe
      tags:
      - PITR management
    put:
      description: 'WARNING: This is a preview API that could change.'
      operationId: updatePitrConfig
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePitrConfigParams'
        description: put pitr config
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Update pitr config for a keyspace in a universe
      tags:
      - PITR management
      x-codegen-request-body-name: pitrConfig
