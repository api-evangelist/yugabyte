        createTime:
          description: Creation time
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          readOnly: true
          type: string
        customerUUID:
          description: Customer UUID
          format: uuid
          readOnly: true
          type: string
        description:
          description: Description
          maxLength: 2147483647
          minLength: 1
          type: string
        endTime:
          description: End time
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        name:
          description: Name
          maxLength: 1000
          minLength: 1
          type: string
        startTime:
          description: Start time
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        state:
