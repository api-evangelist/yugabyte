openapi: 3.2.0
info:
  title: Yugabytedb Universe information API
  version: v1
  contact:
    name: https://docs.yugabyte.com
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  termsOfService: TODO(chirag)
  description: 'Operations tagged Universe information across 2 of this provider''s published API definitions: openapi_2.yaml, platform.swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Universe information
paths:
  /api/v1/customers/{cUUID}/cost:
    servers:
    - url: /
    get:
      description: YbaApi Internal. (Will be removed in next iteration)
      operationId: getUniverseCostForAll
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UniverseResourceDetails'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a cost estimate for all universes
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/cost:
    servers:
    - url: /
    get:
      deprecated: true
      description: 'Deprecated since YBA version 2.20.0.0.

        Use /universe_resources'
      operationId: getUniverseCost
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseResourceDetails'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a cost estimate for a universe - deprecated
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/health_check:
    servers:
    - url: /
    get:
      description: Available since YBA version 2.2.0.0. Checks the health of all tablet servers and masters in the universe, as well as certain conditions on the machines themselves, including disk utilization, presence of FATAL or core files, and more.
      operationId: healthCheckUniverse
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Details'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Return results for the last health check
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/leader:
    servers:
    - url: /
    get:
      description: Available since YBA version 2.2.0.0.
      operationId: getMasterLeaderIP
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get IP address of a universe's master leader
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/live_queries:
    servers:
    - url: /
    get:
      description: Available since YBA version 2.4.0.0.
      operationId: getLiveQueries
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get live queries for a universe
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/master_infos:
    servers:
    - url: /
    get:
      description: YbaApi Internal.
      operationId: getMasterInfos
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MasterInfo'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get master information list
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/slow_queries:
    servers:
    - url: /
    delete:
      description: Available since YBA version 2.6.0.0.
      operationId: resetSlowQueries
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Reset slow queries for a universe
      tags:
      - Universe information
    get:
      description: Available since YBA version 2.6.0.0.
      operationId: getSlowQueries
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get slow queries for a universe
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/status:
    servers:
    - url: /
    get:
      description: Available since YBA version 2.2.0.0. This will return a Map of node name to its status in json format.
      operationId: universeStatus
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  properties: {}
                  type: object
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a universe's status
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/trigger_health_check:
    servers:
    - url: /
    get:
      description: YbaApi Internal. Trigger a universe health check and return the trigger time.
      operationId: triggerHealthCheck
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerHealthCheckResult'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Trigger a universe health check
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/universe_resources:
    servers:
    - url: /
    get:
      description: Available since YBA version 2.20.0.0. Expects UniverseDefinitionTaskParams in request body and calculates the resource estimate for NodeDetailsSet in that.
      operationId: getUniverseResources
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseResourceDetails'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a resource usage estimate for a universe
      tags:
      - Universe information
  /api/v1/customers/{cUUID}/universes/{uniUUID}/{nodeName}/download_logs:
    servers:
    - url: /
    get:
      deprecated: true
      description: 'Deprecated since YBA version 2.20.0.0.

        User Support bundle. Downloads the log files from a given node.'
      operationId: downloadNodeLogs
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: nodeName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/x-compressed:
              schema:
                type: string
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Download a node's logs - deprecated
      tags:
      - Universe information
