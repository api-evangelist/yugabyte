    EditBackupScheduleParams:
      description: Info to edit the schedule params for backups
      example:
        cronExpression: cronExpression
        frequencyTimeUnit: NANOSECONDS
        incrementalBackupFrequencyTimeUnit: NANOSECONDS
        timeBeforeDelete: 1
        incrementalBackupFrequency: 6
        runImmediateBackupOnResume: true
        frequency: 0
        status: Deleting
      properties:
        cronExpression:
          description: Cron expression for scheduling
          type: string
        frequency:
          description: Frequency of the schedule
          format: int64
          type: integer
        frequencyTimeUnit:
          description: Time Unit for frequency
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
          - MONTHS
          - YEARS
          type: string
        incrementalBackupFrequency:
          description: Frequency of incremental backup schedule
          format: int64
          type: integer
        incrementalBackupFrequencyTimeUnit:
          description: TimeUnit for incremental Backup Schedule frequency
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
          - MONTHS
          - YEARS
          type: string
        runImmediateBackupOnResume:
          description: Run a full or incremental backup if the schedule is expired when resuming a stopped schedule
          type: boolean
        status:
          description: State of the schedule
          enum:
          - Deleting
          - Error
          - Active
          - Creating
          - Paused
          - Stopped
          - Editing
          type: string
        timeBeforeDelete:
          description: Time before deleting the backup from storage, in milliseconds
          format: int64
          type: integer
      type: object
