openapi: 3.2.0
info:
  title: Yugabytedb Cloud Providers API
  version: v1
  contact:
    name: https://docs.yugabyte.com
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  termsOfService: TODO(chirag)
  description: 'Operations tagged Cloud providers across 2 of this provider''s published API definitions: openapi_2.yaml, platform.swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Cloud Providers
paths:
  /api/v1/customers/{cUUID}/providers:
    servers:
    - url: /
    get:
      operationId: getListOfProviders
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: name
        schema:
          default: 'null'
          type: string
      - in: query
        name: providerCode
        schema:
          default: 'null'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Provider'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List cloud providers
      tags:
      - Cloud Providers
    post:
      operationId: createProviders
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: validate
        schema:
          default: true
          type: boolean
      - in: query
        name: ignoreValidationErrors
        schema:
          default: false
          type: boolean
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Provider'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Create a provider
      tags:
      - Cloud Providers
      x-codegen-request-body-name: CreateProviderRequest
  /api/v1/customers/{cUUID}/providers/region_metadata/{code}:
    servers:
    - url: /
    get:
      operationId: getRegionMetadata
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: code
        required: true
        schema:
          type: string
      - in: query
        name: subType
        schema:
          default: 'null'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionMetadata'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Retrieves the region metadata for the cloud providers
      tags:
      - Cloud Providers
  /api/v1/customers/{cUUID}/providers/{pUUID}:
    servers:
    - url: /
    delete:
      operationId: delete
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Delete a cloud provider
      tags:
      - Cloud Providers
    get:
      operationId: getProvider
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a cloud provider
      tags:
      - Cloud Providers
  /api/v1/customers/{cUUID}/providers/{pUUID}/access_key_rotation:
    servers:
    - url: /
    post:
      description: 'WARNING: This is a preview API that could change.'
      operationId: accessKeyRotation
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Rotate access key for a provider
      tags:
      - Cloud Providers
  /api/v1/customers/{cUUID}/providers/{pUUID}/access_key_rotation/schedule:
    servers:
    - url: /
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: listSchedules
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Schedule'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List all schedules for a provider's access key rotation
      tags:
      - Cloud Providers
    post:
      description: 'WARNING: This is a preview API that could change.'
      operationId: scheduledAccessKeyRotation
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Rotate access key for a provider - Scheduled
      tags:
      - Cloud Providers
  /api/v1/customers/{cUUID}/providers/{pUUID}/access_key_rotation/schedule/{sUUID}:
    servers:
    - url: /
    put:
      description: 'WARNING: This is a preview API that could change.'
      operationId: editAccessKeyRotationSchedule
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: sUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAccessKeyRotationScheduleParams'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Edit a access key rotation schedule
      tags:
      - Cloud Providers
      x-codegen-request-body-name: body
  /api/v1/customers/{cUUID}/providers/{pUUID}/edit:
    servers:
    - url: /
    put:
      operationId: editProvider
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: validate
        schema:
          default: true
          type: boolean
      - in: query
        name: ignoreValidationErrors
        schema:
          default: false
          type: boolean
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Provider'
        description: edit provider form data
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Update a provider
      tags:
      - Cloud Providers
      x-codegen-request-body-name: EditProviderRequest
  /api/v1/customers/{cUUID}/providers/{pUUID}/refresh_pricing:
    servers:
    - url: /
    put:
      description: 'WARNING: This is a preview API that could change.'
      operationId: refreshPricing
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPSuccess'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Refresh provider pricing info
      tags:
      - Cloud Providers
components:
  schemas:
    KubernetesInfo:
      example:
        kubernetesImagePullSecretName: kubernetesImagePullSecretName
        kubernetesPullSecretContent: kubernetesPullSecretContent
        isKubernetesOperatorControlled: true
        kubernetesOperatorControlled: true
        kubeConfig: kubeConfig
        kubernetesPullSecret: kubernetesPullSecret
        kubeConfigName: kubeConfigName
        kubernetesProvider: kubernetesProvider
        kubeConfigContent: kubeConfigContent
        kubernetesPullSecretName: kubernetesPullSecretName
        kubernetesImageRegistry: kubernetesImageRegistry
        kubernetesStorageClass: kubernetesStorageClass
        kubernetesServiceAccount: kubernetesServiceAccount
      properties:
        isKubernetesOperatorControlled:
          readOnly: true
          type: boolean
        kubeConfig:
          readOnly: true
          type: string
        kubeConfigContent:
          type: string
        kubeConfigName:
          type: string
        kubernetesImagePullSecretName:
          type: string
        kubernetesImageRegistry:
          type: string
        kubernetesOperatorControlled:
          type: boolean
        kubernetesProvider:
          type: string
        kubernetesPullSecret:
          readOnly: true
          type: string
        kubernetesPullSecretContent:
          type: string
        kubernetesPullSecretName:
          type: string
        kubernetesServiceAccount:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.17.3.0.</b> kubernetes service account is not needed.
          type: string
        kubernetesStorageClass:
          type: string
      required:
      - kubernetesOperatorControlled
      type: object
    YBPTask:
      example:
        taskUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        resourceUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        resourceUUID:
          description: UUID of the resource being modified by the task
          format: uuid
          readOnly: true
          type: string
        taskUUID:
          description: Task UUID
          format: uuid
          readOnly: true
          type: string
      type: object
    AZCloudInfo:
      example:
        kubernetes:
          kubeNamespace: kubeNamespace
          kubernetesImagePullSecretName: kubernetesImagePullSecretName
          kubernetesPullSecretContent: kubernetesPullSecretContent
          certManagerIssuer: certManagerIssuer
          isKubernetesOperatorControlled: true
          kubernetesOperatorControlled: true
          kubeConfig: kubeConfig
          kubeDomain: kubeDomain
          overrides: overrides
          certManagerIssuerName: certManagerIssuerName
          kubernetesPullSecret: kubernetesPullSecret
          kubeConfigName: kubeConfigName
          certManagerIssuerKind: certManagerIssuerKind
          kubePodAddressTemplate: kubePodAddressTemplate
          kubernetesProvider: kubernetesProvider
          kubeConfigContent: kubeConfigContent
          kubernetesPullSecretName: kubernetesPullSecretName
          certManagerIssuerGroup: certManagerIssuerGroup
          kubernetesImageRegistry: kubernetesImageRegistry
          certManagerClusterIssuer: certManagerClusterIssuer
          kubernetesStorageClass: kubernetesStorageClass
          kubernetesServiceAccount: kubernetesServiceAccount
      properties:
        kubernetes:
          $ref: '#/components/schemas/KubernetesRegionInfo'
      type: object
    AWSRegionCloudInfo:
      example:
        securityGroupId: securityGroupId
        vnet: vnet
        ybImage: ybImage
        arch: x86_64
      properties:
        arch:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.20.0.</b> Use provider.imageBundle instead
          enum:
          - x86_64
          - aarch64
          type: string
        securityGroupId:
          type: string
        vnet:
          type: string
        ybImage:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.20.0.</b> Use provider.imageBundle instead
          type: string
      type: object
    LocalCloudInfo:
      example:
        hostedZoneId: hostedZoneId
        yugabyteBinDir: yugabyteBinDir
        dataHomeDir: dataHomeDir
        envVars:
          key: envVars
        ybcBinDir: ybcBinDir
      properties:
        dataHomeDir:
          type: string
        envVars:
          additionalProperties:
            type: string
          type: object
        hostedZoneId:
          type: string
        ybcBinDir:
          type: string
        yugabyteBinDir:
          type: string
      required:
      - dataHomeDir
      - envVars
      - hostedZoneId
      - ybcBinDir
      - yugabyteBinDir
      type: object
    GCPCloudInfo:
      example:
        useHostVPC: true
        hostVpcId: hostVpcId
        destVpcId: destVpcId
        gceProject: gceProject
        gceApplicationCredentials: gceApplicationCredentials
        gceApplicationCredentialsPath: gceApplicationCredentialsPath
        useHostCredentials: true
        vpcType: EXISTING
        sharedVPCProject: sharedVPCProject
        ybFirewallTags: ybFirewallTags
      properties:
        destVpcId:
          type: string
        gceApplicationCredentials:
          type: string
        gceApplicationCredentialsPath:
          readOnly: true
          type: string
        gceProject:
          type: string
        hostVpcId:
          readOnly: true
          type: string
        sharedVPCProject:
          type: string
        useHostCredentials:
          type: boolean
        useHostVPC:
          type: boolean
        vpcType:
          description: New/Existing VPC for provider creation
          enum:
          - EXISTING
          - NEW
          - HOSTVPC
          readOnly: true
          type: string
        ybFirewallTags:
          type: string
      type: object
    KubernetesRegionInfo:
      example:
        kubeNamespace: kubeNamespace
        kubernetesImagePullSecretName: kubernetesImagePullSecretName
        kubernetesPullSecretContent: kubernetesPullSecretContent
        certManagerIssuer: certManagerIssuer
        isKubernetesOperatorControlled: true
        kubernetesOperatorControlled: true
        kubeConfig: kubeConfig
        kubeDomain: kubeDomain
        overrides: overrides
        certManagerIssuerName: certManagerIssuerName
        kubernetesPullSecret: kubernetesPullSecret
        kubeConfigName: kubeConfigName
        certManagerIssuerKind: certManagerIssuerKind
        kubePodAddressTemplate: kubePodAddressTemplate
        kubernetesProvider: kubernetesProvider
        kubeConfigContent: kubeConfigContent
        kubernetesPullSecretName: kubernetesPullSecretName
        certManagerIssuerGroup: certManagerIssuerGroup
        kubernetesImageRegistry: kubernetesImageRegistry
        certManagerClusterIssuer: certManagerClusterIssuer
        kubernetesStorageClass: kubernetesStorageClass
        kubernetesServiceAccount: kubernetesServiceAccount
      properties:
        certManagerClusterIssuer:
          description: <b style="color:#ff0000">Deprecated since YBA version 2024.2.3.0.</b>. Use certManagerIssuerKind and certManagerIssuerName instead
          type: string
        certManagerIssuer:
          description: <b style="color:#ff0000">Deprecated since YBA version 2024.2.3.0.</b>. Use certManagerIssuerKind and certManagerIssuerName instead
          type: string
        certManagerIssuerGroup:
          type: string
        certManagerIssuerKind:
          type: string
        certManagerIssuerName:
          type: string
        isKubernetesOperatorControlled:
          readOnly: true
          type: boolean
        kubeConfig:
          readOnly: true
          type: string
        kubeConfigContent:
          type: string
        kubeConfigName:
          type: string
        kubeDomain:
          type: string
        kubeNamespace:
          type: string
        kubePodAddressTemplate:
          type: string
        kubernetesImagePullSecretName:
          type: string
        kubernetesImageRegistry:
          type: string
        kubernetesOperatorControlled:
          type: boolean
        kubernetesProvider:
          type: string
        kubernetesPullSecret:
          readOnly: true
          type: string
        kubernetesPullSecretContent:
          type: string
        kubernetesPullSecretName:
          type: string
        kubernetesServiceAccount:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.17.3.0.</b> kubernetes service account is not needed.
          type: string
        kubernetesStorageClass:
          type: string
        overrides:
          type: string
      required:
      - kubernetesOperatorControlled
      type: object
    GCPRegionCloudInfo:
      example:
        instanceTemplate: instanceTemplate
        ybImage: ybImage
      properties:
        instanceTemplate:
          description: The instance template to be used for nodes created in this region.
          type: string
        ybImage:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.20.0.</b> Use provider.imageBundle instead
          type: string
      type: object
    EditAccessKeyRotationScheduleParams:
      example:
        schedulingFrequencyDays: 0
        status: Deleting
      properties:
        schedulingFrequencyDays:
          description: Frequency of the schedule in days
          format: int32
          type: integer
        status:
          description: State of the schedule
          enum:
          - Deleting
          - Error
          - Active
          - Creating
          - Paused
          - Stopped
          - Editing
          type: string
      type: object
    YBPSuccess:
      example:
        success: true
        message: message
      properties:
        message:
          description: API response message.
          readOnly: true
          type: string
        success:
          description: API operation status. A value of true indicates the operation was successful.
          readOnly: true
          type: boolean
      type: object
    RegionMetadataInfo:
      example:
        latitude: 0.8008281904610115
        name: name
        availabilityZones:
        - availabilityZones
        - availabilityZones
        longitude: 6.027456183070403
      properties:
        availabilityZones:
          items:
            type: string
          type: array
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
      required:
      - availabilityZones
      - latitude
      - longitude
      - name
      type: object
    BundleInfo:
      example:
        sshUserOverride: sshUserOverride
        ybImage: ybImage
        sshPortOverride: 1
      properties:
        sshPortOverride:
          description: sshPortOverride for the bundle. <b style="color:#ff0000">Deprecated since YBA version 2.20.3.0.</b> Use imageBundles.details.sshUser instead.
          format: int32
          type: integer
        sshUserOverride:
          description: sshUserOverride for the bundle. <b style="color:#ff0000">Deprecated since YBA version 2.20.3.0.</b> Use imageBundles.details.sshUser instead.
          type: string
        ybImage:
          type: string
      type: object
    OnPremCloudInfo:
      example:
        ybHomeDir: ybHomeDir
        useClockbound: true
      properties:
        useClockbound:
          description: 'WARNING: This is a preview API that could change.'
          type: boolean
        ybHomeDir:
          type: string
      type: object
    AccessKey:
      description: Access key for the cloud provider. This helps to authenticate the user and get access to the provider.
      example:
        idKey:
          keyCode: keyCode
          providerUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        creationDate: 2022-12-12 13:07:18+00:00
        keyInfo:
          sshPort: 6
          nodeExporterPort: 0
          installNodeExporter: true
          skipProvisioning: true
          nodeExporterUser: nodeExporterUser
          provisionInstanceScript: provisionInstanceScript
          passwordlessSudoAccess: true
          publicKey: publicKey
          vaultFile: vaultFile
          sshPrivateKeyContent: sshPrivateKeyContent
          privateKey: privateKey
          setUpChrony: true
          vaultPasswordFile: vaultPasswordFile
          ntpServers:
          - ntpServers
          - ntpServers
          skipKeyValidateAndUpload: true
          sshUser: sshUser
          deleteRemote: true
          showSetUpChrony: true
          airGapInstall: true
          keyPairName: keyPairName
          managementState: YBAManaged
        expirationDate: 2022-12-12 13:07:18+00:00
      properties:
        creationDate:
          description: Creation date of key
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          readOnly: true
          type: string
        expirationDate:
          description: Expiration date of key
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        idKey:
          $ref: '#/components/schemas/AccessKeyId'
        keyInfo:
          $ref: '#/components/schemas/KeyInfo'
      required:
      - idKey
      - keyInfo
      type: object
    AzureRegionCloudInfo:
      example:
        securityGroupId: securityGroupId
        vnet: vnet
        ybImage: ybImage
        azuNetworkRGOverride: azuNetworkRGOverride
        azuRGOverride: azuRGOverride
      properties:
        azuNetworkRGOverride:
          type: string
        azuRGOverride:
          type: string
        securityGroupId:
          type: string
        vnet:
          type: string
        ybImage:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.20.0.</b> Use provider.imageBundle instead
          type: string
      type: object
    Metadata:
      example:
        type: YBA_ACTIVE
        version: version
      properties:
        type:
          enum:
          - YBA_ACTIVE
          - YBA_DEPRECATED
          - CUSTOM
          type: string
        version:
          type: string
      required:
      - type
      - version
      type: object
    Region:
      description: Region within a given provider. Typically, this maps to a single cloud provider region.
      example:
        securityGroupId: securityGroupId
        code: us-west-2
        ybImage: TODO
        latitude: 37.22
        name: US West (Oregon)
        active: true
        details:
          cloudInfo:
            kubernetes:
              kubeNamespace: kubeNamespace
              kubernetesImagePullSecretName: kubernetesImagePullSecretName
              kubernetesPullSecretContent: kubernetesPullSecretContent
              certManagerIssuer: certManagerIssuer
              isKubernetesOperatorControlled: true
              kubernetesOperatorControlled: true
              kubeConfig: kubeConfig
              kubeDomain: kubeDomain
              overrides: overrides
              certManagerIssuerName: certManagerIssuerName
              kubernetesPullSecret: kubernetesPullSecret
              kubeConfigName: kubeConfigName
              certManagerIssuerKind: certManagerIssuerKind
              kubePodAddressTemplate: kubePodAddressTemplate
              kubernetesProvider: kubernetesProvider
              kubeConfigContent: kubeConfigContent
              kubernetesPullSecretName: kubernetesPullSecretName
              certManagerIssuerGroup: certManagerIssuerGroup
              kubernetesImageRegistry: kubernetesImageRegistry
              certManagerClusterIssuer: certManagerClusterIssuer
              kubernetesStorageClass: kubernetesStorageClass
              kubernetesServiceAccount: kubernetesServiceAccount
            gcp:
              instanceTemplate: instanceTemplate
              ybImage: ybImage
            aws:
              securityGroupId: securityGroupId
              vnet: vnet
              ybImage: ybImage
              arch: x86_64
            azu:
              securityGroupId: securityGroupId
              vnet: vnet
              ybImage: ybImage
              azuNetworkRGOverride: azuNetworkRGOverride
              azuRGOverride: azuRGOverride
        vnetName: vnetName
        zones:
        - subnet: subnet id
          code: us-west1-a
          name: us-west1-a
          active: true
          details:
            cloudInfo:
              kubernetes:
                kubeNamespace: kubeNamespace
                kubernetesImagePullSecretName: kubernetesImagePullSecretName
                kubernetesPullSecretContent: kubernetesPullSecretContent
                certManagerIssuer: certManagerIssuer
                isKubernetesOperatorControlled: true
                kubernetesOperatorControlled: true
                kubeConfig: kubeConfig
                kubeDomain: kubeDomain
                overrides: overrides
                certManagerIssuerName: certManagerIssuerName
                kubernetesPullSecret: kubernetesPullSecret
                kubeConfigName: kubeConfigName
                certManagerIssuerKind: certManagerIssuerKind
                kubePodAddressTemplate: kubePodAddressTemplate
                kubernetesProvider: kubernetesProvider
                kubeConfigContent: kubeConfigContent
                kubernetesPullSecretName: kubernetesPullSecretName
                certManagerIssuerGroup: certManagerIssuerGroup
                kubernetesImageRegistry: kubernetesImageRegistry
                certManagerClusterIssuer: certManagerClusterIssuer
                kubernetesStorageClass: kubernetesStorageClass
                kubernetesServiceAccount: kubernetesServiceAccount
          kubeconfigPath: kubeconfigPath
          config:
            key: config
          uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          secondarySubnet: secondary subnet id
        - subnet: subnet id
          code: us-west1-a
          name: us-west1-a
          active: true
          details:
            cloudInfo:
              kubernetes:
                kubeNamespace: kubeNamespace
