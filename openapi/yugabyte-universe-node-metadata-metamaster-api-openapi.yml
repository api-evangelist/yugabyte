      operationId: getMasterLBState
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterLBStateResponse'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get the state of master load balancing ops
      tags:
      - Universe node metadata (metamaster)
