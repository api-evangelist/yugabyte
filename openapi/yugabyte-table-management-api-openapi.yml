openapi: 3.2.0
info:
  title: Yugabytedb Table Management API
  version: v1
  contact:
    name: https://docs.yugabyte.com
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  termsOfService: TODO(chirag)
  description: 'Operations tagged Table management across 2 of this provider''s published API definitions: openapi_2.yaml, platform.swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Table Management
paths:
  /api/v1/customers/{cUUID}/universes/{uniUUID}/namespaces:
    servers:
    - url: /
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: getAllNamespaces
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: includeSystemNamespaces
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NamespaceInfoResp'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a list of all namespaces in the specified universe
      tags:
      - Table Management
  /api/v1/customers/{cUUID}/universes/{uniUUID}/tables:
    servers:
    - url: /
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: getAllTables
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: includeParentTableInfo
        schema:
          default: false
          type: boolean
      - in: query
        name: excludeColocatedTables
        schema:
          default: false
          type: boolean
      - in: query
        name: includeColocatedParentTables
        schema:
          default: true
          type: boolean
      - in: query
        name: xClusterSupportedOnly
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TableInfoResp'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a list of all tables in the specified universe
      tags:
      - Table Management
    post:
      description: YbaApi Internal.
      operationId: createTable
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinitionTaskParams'
        description: Table definition to be created
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Create a YugabyteDB table
      tags:
      - Table Management
      x-codegen-request-body-name: Table
  /api/v1/customers/{cUUID}/universes/{uniUUID}/tables/{tableUUID}:
    servers:
    - url: /
    delete:
      description: YbaApi Internal.
      operationId: dropTable
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tableUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Drop a YugabyteDB table
      tags:
      - Table Management
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: describeTable
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tableUUID
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinitionTaskParams'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Describe a table
      tags:
      - Table Management
    put:
      description: YbaApi Internal.
      operationId: alterTable
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tableUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  properties: {}
                  type: object
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Alter a YugabyteDB table
      tags:
      - Table Management
  /api/v1/customers/{cUUID}/universes/{uniUUID}/tables/{tableUUID}/bulk_import:
    servers:
    - url: /
    put:
      description: YbaApi Internal. Bulk import data into the specified table. This is currently AWS-only.
      operationId: bulkImportData
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tableUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportParams'
        description: Bulk data to be imported
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Bulk import data
      tags:
      - Table Management
      x-codegen-request-body-name: Bulk import
  /api/v1/customers/{cUUID}/universes/{uniUUID}/tablespaces:
    servers:
    - url: /
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: getAllTableSpaces
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TableSpaceInfo'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a list of all tablespaces of a given universe
      tags:
      - Table Management
    post:
      description: YbaApi Internal.
      operationId: createTableSpaces
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTablespaceParams'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Create tableSpaces
      tags:
      - Table Management
      x-codegen-request-body-name: CreateTableSpacesRequest
  /api/v1/metadata/yql_data_types:
    servers:
    - url: /
    get:
      description: YbaApi Internal. Get a list of all defined column types.
      operationId: getYQLDataTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  enum:
                  - TINYINT
                  - SMALLINT
                  - INT
                  - BIGINT
                  - VARCHAR
                  - BOOLEAN
                  - FLOAT
                  - DOUBLE_PRECISION
                  - BLOB
                  - TIMESTAMP
                  - DECIMAL
                  - VARINT
                  - INET
                  - LIST
                  - MAP
                  - SET
                  - UUID
                  - TIMEUUID
                  - FROZEN
                  - DATE
                  - TIME
                  - JSONB
                  - USER_DEFINED_TYPE
                  type: string
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List column types
      tags:
      - Table Management
  /api/v1/customers/{cUUID}/universes/{uniUUID}/multi_table_backup:
    put:
      description: ''
      operationId: createMultiTableBackup
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: uniUUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'If requested schedule backup. Changes from upstream: This API call actually returns a task, not a Schedule'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask_2'
        '400':
          description: 'When request fails validations. Changes from upstream: Return code 400 is not in swagger spec'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPError'
      security:
      - apiKeyAuth: []
      summary: Create a multi-table backup
      tags:
      - Table Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiTableBackupRequestParams'
        description: Table backup data to be created
        required: true
  /api/v1/customers/{cUUID}/universes/{uniUUID}/tables/{tableUUID}/create_backup:
    put:
      description: ''
      operationId: createSingleTableBackup
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: uniUUID
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: tableUUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask_2'
      security:
      - apiKeyAuth: []
      summary: Create a single-table backup
      tags:
      - Table Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupTableParams'
        description: Backup data to be created
        required: true
components:
  schemas:
    PlacementBlock:
      example:
        cloud: cloud
        leader_preference: 1
        zone: zone
        min_num_replicas: 1
        region: region
      properties:
        cloud:
          description: Cloud
          maxLength: 2147483647
          minLength: 1
          type: string
        leader_preference:
          description: Leader preference
          format: int32
          minimum: 1
          type: integer
        min_num_replicas:
          description: Minimum replicas
          format: int32
          minimum: 1
          type: integer
        region:
          description: Region
          maxLength: 2147483647
          minLength: 1
          type: string
        zone:
          description: Zone
          maxLength: 2147483647
          minLength: 1
          type: string
      required:
      - cloud
      - region
      - zone
      type: object
    YBPTask:
      example:
        taskUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        resourceUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        resourceUUID:
          description: UUID of the resource being modified by the task
          format: uuid
          readOnly: true
          type: string
        taskUUID:
          description: Task UUID
          format: uuid
          readOnly: true
          type: string
      type: object
    CloudVolumeEncryption:
      description: Volume encryption settings for AWS EBS volumes
      example:
        enableVolumeEncryption: true
        kmsConfigUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        enableVolumeEncryption:
          description: To enable volume encryption or not
          type: boolean
        kmsConfigUUID:
          description: KMS config UUID to be used for volume encryption
          format: uuid
          type: string
      type: object
    CommunicationPorts:
      description: Communication ports
      example:
        nodeExporterPort: 5
        tserverHttpPort: 9
        internalYsqlServerRpcPort: 0
        ybControllerHttpPort: 2
        redisServerHttpPort: 2
        ybControllerrRpcPort: 4
        tserverRpcPort: 3
        ysqlServerHttpPort: 1
        yqlServerRpcPort: 1
        masterHttpPort: 6
        otelCollectorMetricsPort: 5
        ysqlServerRpcPort: 1
        yqlServerHttpPort: 7
        masterRpcPort: 1
        redisServerRpcPort: 7
      properties:
        internalYsqlServerRpcPort:
          description: Internal YSQL RPC port
          format: int32
          type: integer
        masterHttpPort:
          description: Master table HTTP port
          format: int32
          type: integer
        masterRpcPort:
          description: Master table RCP port
          format: int32
          type: integer
        nodeExporterPort:
          description: Node exporter port
          format: int32
          type: integer
        otelCollectorMetricsPort:
          description: Otel Collector metrics port
          format: int32
          type: integer
        redisServerHttpPort:
          description: Redis HTTP port
          format: int32
          type: integer
        redisServerRpcPort:
          description: Redis RPC port
          format: int32
          type: integer
        tserverHttpPort:
          description: Tablet server HTTP port
          format: int32
          type: integer
        tserverRpcPort:
          description: Tablet server RPC port
          format: int32
          type: integer
        ybControllerHttpPort:
          description: Yb controller HTTP port
          format: int32
          type: integer
        ybControllerrRpcPort:
          description: Yb controller RPC port
          format: int32
          type: integer
        yqlServerHttpPort:
          description: YQL HTTP port
          format: int32
          type: integer
        yqlServerRpcPort:
          description: YQL RPC port
          format: int32
          type: integer
        ysqlServerHttpPort:
          description: YSQL HTTP port
          format: int32
          type: integer
        ysqlServerRpcPort:
          description: YSQL RPC port
          format: int32
          type: integer
      type: object
    Users:
      description: A user associated with a customer
      example:
        ldapSpecifiedRole: true
        customerUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        role: Admin
        authTokenIssueDate: 2021-06-17 15:00:05+00:00
        timezone: timezone
        oidcJwtAuthToken: oidcJwtAuthToken
        groupMemberships:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        userType: local
        creationDate: 2022-12-12 13:07:18+00:00
        uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        email: username1@example.com
        primary: true
      properties:
        authTokenIssueDate:
          description: UI session token creation date
          example: 2021-06-17 15:00:05+00:00
          format: date-time
          readOnly: true
          type: string
        creationDate:
          description: User creation date
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          readOnly: true
          type: string
        customerUUID:
          description: Customer UUID
          format: uuid
          readOnly: true
          type: string
        email:
          description: User email address
          example: username1@example.com
          type: string
        groupMemberships:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
        ldapSpecifiedRole:
          description: LDAP Specified Role
          type: boolean
        oidcJwtAuthToken:
          readOnly: true
          type: string
        primary:
          type: boolean
        role:
          description: <b style="color:#ff0000">Deprecated since YBA version 2.19.3.0.</b> Use  getRoleBindings instead.
          enum:
          - ConnectOnly
          - ReadOnly
          - BackupAdmin
          - Admin
          - SuperAdmin
          example: Admin
          type: string
        timezone:
          description: User timezone
          type: string
        userType:
          description: User Type
          enum:
          - local
          - ldap
          - oidc
          type: string
        uuid:
          description: User UUID
          format: uuid
          readOnly: true
          type: string
      required:
      - email
      - groupMemberships
      - primary
      type: object
    ColumnDetails:
      description: Details of a CQL database column
      example:
        columnOrder: 5
        isClusteringKey: true
        sortOrder: NONE
        valueType: TINYINT
        name: name
        keyType: TINYINT
        type: TINYINT
        isPartitionKey: true
      properties:
        columnOrder:
          description: Relative position (column order) for this column, in the table and in CQL commands
          format: int32
          type: integer
        isClusteringKey:
          description: True if this column is a clustering key
          type: boolean
        isPartitionKey:
          description: True if this column is a partition key
          type: boolean
        keyType:
          description: Column key type
          enum:
          - TINYINT
          - SMALLINT
          - INT
          - BIGINT
          - VARCHAR
          - BOOLEAN
          - FLOAT
          - DOUBLE_PRECISION
          - BLOB
          - TIMESTAMP
          - DECIMAL
          - VARINT
          - INET
          - LIST
          - MAP
          - SET
          - UUID
          - TIMEUUID
          - FROZEN
          - DATE
          - TIME
          - JSONB
          - USER_DEFINED_TYPE
          type: string
        name:
          description: Column name
          type: string
        sortOrder:
          description: Sort order for this column. Valid only for clustering columns.
          enum:
          - NONE
          - ASC
          - DESC
          type: string
        type:
          description: The column's data type
          enum:
          - TINYINT
          - SMALLINT
          - INT
          - BIGINT
          - VARCHAR
          - BOOLEAN
          - FLOAT
          - DOUBLE_PRECISION
          - BLOB
          - TIMESTAMP
          - DECIMAL
          - VARINT
          - INET
          - LIST
          - MAP
          - SET
          - UUID
          - TIMEUUID
          - FROZEN
          - DATE
          - TIME
          - JSONB
          - USER_DEFINED_TYPE
          type: string
        valueType:
          description: Column value name
          enum:
          - TINYINT
          - SMALLINT
          - INT
          - BIGINT
          - VARCHAR
          - BOOLEAN
          - FLOAT
          - DOUBLE_PRECISION
          - BLOB
          - TIMESTAMP
          - DECIMAL
          - VARINT
          - INET
          - LIST
          - MAP
          - SET
          - UUID
          - TIMEUUID
          - FROZEN
          - DATE
          - TIME
          - JSONB
          - USER_DEFINED_TYPE
          type: string
      type: object
    CommunicationPorts_2:
      description: Communication ports
      properties:
        masterHttpPort:
          description: Master table HTTP port
          format: int32
          type: integer
        masterRpcPort:
          description: Master table RCP port
          format: int32
          type: integer
        nodeExporterPort:
          description: Node exporter port
          format: int32
          type: integer
        redisServerHttpPort:
          description: Redis HTTP port
          format: int32
          type: integer
        redisServerRpcPort:
          description: Redis RPC port
          format: int32
          type: integer
        tserverHttpPort:
          description: Tablet server HTTP port
          format: int32
          type: integer
        tserverRpcPort:
          description: Tablet server RPC port
          format: int32
          type: integer
        yqlServerHttpPort:
          description: YQL HTTP port
          format: int32
          type: integer
        yqlServerRpcPort:
          description: YQL RPC port
          format: int32
          type: integer
        ysqlServerHttpPort:
          description: YSQL HTTP port
          format: int32
          type: integer
        ysqlServerRpcPort:
          description: YSQL RPC port
          format: int32
          type: integer
      type: object
    ExtraDependencies:
      description: Extra dependencies
      example:
        installNodeExporter: true
      properties:
        installNodeExporter:
          description: Install node exporter on nodes
          type: boolean
      type: object
    DeviceInfo_2:
      description: Device information
      properties:
        diskIops:
          description: Desired IOPS for the volumes mounted on this instance
          format: int32
          type: integer
        mountPoints:
          description: Comma-separated list of mount points for the devices in each instance
          type: string
        numVolumes:
          description: Number of volumes to be mounted on this instance at the default path
          format: int32
          type: integer
        storageClass:
          description: Name of the storage class
          type: string
        storageType:
          description: Storage type used for this instance
          enum:
          - IO1
          - GP2
          - GP3
          - Scratch
          - Persistent
          - StandardSSD_LRS
          - Premium_LRS
          - UltraSSD_LRS
          type: string
        throughput:
          description: Desired throughput for the volumes mounted on this instance
          format: int32
          type: integer
        volumeSize:
          description: The size of each volume in each instance
          format: int32
          type: integer
      type: object
    EncryptionAtRestConfig_2:
      description: Encryption at rest configuration
      properties:
        encryptionAtRestEnabled:
          description: Whether a universe is currently encrypted at rest
          type: boolean
        kmsConfigUUID:
          description: KMS configuration UUID
          format: uuid
          type: string
        opType:
          description: 'Operation type: enable, disable, or rotate the universe key/encryption at rest'
          enum:
          - ENABLE
          - DISABLE
          - UNDEFINED
          type: string
        type:
          description: Whether to generate a data key or just retrieve the CMK ARN
          enum:
          - CMK
          - DATA_KEY
          type: string
      type: object
    NamespaceInfoResp:
      description: Namespace information response
      example:
        tableType: YQL_TABLE_TYPE
        name: name
        namespaceUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        name:
          description: Namespace name
          type: string
        namespaceUUID:
          description: Namespace UUID
          format: uuid
          readOnly: true
          type: string
        tableType:
          description: Table type
          enum:
          - YQL_TABLE_TYPE
          - REDIS_TABLE_TYPE
          - PGSQL_TABLE_TYPE
          - TRANSACTION_STATUS_TABLE_TYPE
          type: string
      type: object
    NodeDetails:
      description: Details of a cloud node
      example:
        nodeName: nodeName
        nodeExporterPort: 3
        placementUuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        ybControllerHttpPort: 3
        dedicatedTo: MASTER
        machineImage: machineImage
        redisServerHttpPort: 2
        masterState: ToStart
        tserverRpcPort: 6
        ysqlServerHttpPort: 7
        yqlServerRpcPort: 0
        otelCollectorMetricsPort: 1
        isMaster: true
        sshUserOverride: sshUserOverride
        cloudInfo:
          mount_roots: mount_roots
          kubernetesNamespace: kubernetesNamespace
          public_ip: public_ip
          secondary_subnet_id: secondary_subnet_id
          private_dns: private_dns
          useTimeSync: true
          kubernetesPodName: kubernetesPodName
          root_volume: root_volume
          secondary_private_ip: secondary_private_ip
          private_ip: private_ip
          cloud: cloud
          lun_indexes:
          - 6
