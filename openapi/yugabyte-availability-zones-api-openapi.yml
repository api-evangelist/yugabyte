    AvailabilityZoneData:
      description: Details of an availability zone, used by the API and UI to validate data against input constraints
      example:
        subnet: subnet
        code: code
        name: name
        secondarySubnet: secondarySubnet
      properties:
        code:
          description: AZ code
          type: string
        name:
