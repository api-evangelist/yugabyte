      description: YbaApi Internal. Runs a YSQL query. Only valid when the platform is running in `OSS` mode.
      operationId: runYsqlQueryUniverse
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
