components:
  schemas:
    PitrConfig:
      description: PITR config created on the universe
      example:
        dbName: dbName
        updateTime: 2022-12-12 13:07:18+00:00
        createdForDr: true
        uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        minRecoverTimeInMillis: 1
        scheduleInterval: 5
        tableType: YQL_TABLE_TYPE
        customerUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        createTime: 2022-12-12 13:07:18+00:00
        intermittentMinRecoverTimeInMillis: 0
        maxRecoverTimeInMillis: 6
        name: name
        disabled: true
        usedForXCluster: true
        state: UNKNOWN
        retentionPeriod: 5
      properties:
        createTime:
          description: Create time of the PITR config
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          readOnly: true
          type: string
        createdForDr:
          description: Created for DR
          readOnly: true
          type: boolean
        customerUUID:
          description: Customer UUID of this config
          format: uuid
          type: string
        dbName:
          description: DB Name
          type: string
        disabled:
          description: Whether the PITR config is disabled
          readOnly: true
          type: boolean
        intermittentMinRecoverTimeInMillis:
          description: Intermittent min recovery time in millis if retention period is increased
          format: int64
          type: integer
        maxRecoverTimeInMillis:
          format: int64
          type: integer
        minRecoverTimeInMillis:
          format: int64
          type: integer
        name:
          description: PITR config name
          type: string
        retentionPeriod:
          description: Retention Period in seconds
          format: int64
          type: integer
        scheduleInterval:
          description: Interval between snasphots in seconds
          format: int64
          type: integer
        state:
          enum:
          - UNKNOWN
          - CREATING
          - COMPLETE
          - DELETING
          - DELETED
          - FAILED
          - CANCELLED
          - RESTORING
          - RESTORED
          type: string
        tableType:
          description: Table Type
          enum:
          - YQL_TABLE_TYPE
          - REDIS_TABLE_TYPE
          - PGSQL_TABLE_TYPE
          - TRANSACTION_STATUS_TABLE_TYPE
          type: string
        updateTime:
          description: Update time of the PITR con
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        usedForXCluster:
          readOnly: true
          type: boolean
        uuid:
          description: PITR config UUID
          format: uuid
          type: string
      required:
      - maxRecoverTimeInMillis
      - minRecoverTimeInMillis
      - state
      type: object
    XClusterConfigNeedBootstrapFormData:
      example:
        targetUniverseUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        isDrConfig: true
        tables: '["000033df00003000800000000000400b"]'
      properties:
        isDrConfig:
          description: 'WARNING: This is a preview API that could change. Whether this check is being done as part of a DR configuration setup'
          type: boolean
        tables:
          description: Source universe table IDs to check whether they need bootstrap
          example: '["000033df00003000800000000000400b"]'
          items:
            type: string
          type: array
          uniqueItems: true
        targetUniverseUUID:
          description: If specified and tables do not exist on the target universe, bootstrapping is required.
          format: uuid
          type: string
      required:
      - tables
      type: object
    XClusterConfigCreateFormData:
      description: xcluster create form
      example:
        targetUniverseUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        tables: '["000033df000030008000000000004006", "000033df00003000800000000000400b"]'
        dryRun: true
        bootstrapParams:
          tables: '["000033df000030008000000000004006"]'
          allowBootstrap: true
          backupRequestParams:
            storageConfigUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            parallelism: 0
        name: Repl-config1
        sourceUniverseUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        configType: Basic
      properties:
        bootstrapParams:
          $ref: '#/components/schemas/BootstrapParams'
        configType:
          description: configType
          enum:
          - Basic
          - Txn
          type: string
        dryRun:
          description: Run the pre-checks without actually running the subtasks
          type: boolean
        name:
          description: Name
          example: Repl-config1
          type: string
        sourceUniverseUUID:
          description: Source Universe UUID
          format: uuid
          type: string
        tables:
          description: Source Universe table IDs
          example: '["000033df000030008000000000004006", "000033df00003000800000000000400b"]'
          items:
            type: string
          type: array
          uniqueItems: true
        targetUniverseUUID:
          description: Target Universe UUID
          format: uuid
          type: string
      required:
      - name
      - sourceUniverseUUID
      - tables
      - targetUniverseUUID
      type: object
    XClusterConfigEditFormData:
      description: xcluster edit form
      example:
        tables: '["000033df000030008000000000004006", "000033df00003000800000000000400b"]'
        dryRun: true
        bootstrapParams:
          tables: '["000033df000030008000000000004006"]'
          allowBootstrap: true
          backupRequestParams:
            storageConfigUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            parallelism: 0
        dbs: '["000033df000030008000000000004006", "000033df00003000800000000000400b"]'
        autoIncludeIndexTables: true
        targetRole: ACTIVE
        name: Repl-config1
        sourceRole: ACTIVE
        status: Running
      properties:
        autoIncludeIndexTables:
          description: Whether or not YBA should also include all index tables from any provided main tables.
          type: boolean
        bootstrapParams:
          $ref: '#/components/schemas/BootstrapParams'
        dbs:
          description: 'WARNING: This is a preview API that could change. Source universe database IDs'
