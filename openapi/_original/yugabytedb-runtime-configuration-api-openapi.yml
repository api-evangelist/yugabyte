paths:
  /api/v1/customers/{cUUID}/runtime_config/scopes:
    get:
      description: Lists all (including empty scopes) runtime config scopes for current customer. List includes the Global scope that spans multiple customers, scope for customer specific overrides for current customer and one scope each for each universe and provider.
      operationId: listScopes
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigData'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List configuration scopes
      tags:
      - Runtime configuration
    servers:
    - url: /
  /api/v1/customers/{cUUID}/runtime_config/{scope}:
    get:
      description: Lists all runtime config entries for a given scope for current customer.
      operationId: getConfig
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: includeInherited
        schema:
          default: false
          type: boolean
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedConfig'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List configuration entries for a scope
      tags:
      - Runtime configuration
    servers:
    - url: /
  /api/v1/customers/{cUUID}/runtime_config/{scope}/key/{key}:
    delete:
      operationId: deleteKey
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPSuccess'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Delete a configuration key
      tags:
      - Runtime configuration
    get:
      operationId: getConfigurationKey
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a configuration key
      tags:
      - Runtime configuration
    put:
      operationId: setKey
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          text/plain:
