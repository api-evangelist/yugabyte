        snooze_until: 2024-07-25 13:07:18+00:00
      properties:
        disabled:
          description: Disable or enable the job schedule.
          type: boolean
        interval_secs:
          description: Delay interval between two jobs.
          format: int64
          type: integer
        snooze_until:
