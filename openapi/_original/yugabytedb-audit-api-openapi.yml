servers:
- url: /
tags:
- name: Audit
paths:
  /api/v1/customers/{cUUID}/tasks/{tUUID}/audit_info:
    get:
      operationId: getTaskAudit
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get audit info for a task
      tags:
      - Audit
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks/{tUUID}/audit_user:
    get:
      operationId: getUserFromTask
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get the user associated with a task
      tags:
      - Audit
    servers:
    - url: /
  /api/v1/customers/{cUUID}/users/{uUUID}/audit_trail:
    get:
      operationId: ListOfAudit
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: uUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Audit'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List a user's audit entries
      tags:
      - Audit
    servers:
    - url: /
