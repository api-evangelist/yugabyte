        name: version
        required: true
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: server
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GFlagDetails'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get gflag metadata
      tags:
      - GFlags Validation APIs
  /api/v1/metadata/version/{version}/list_gflags:
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: listGFlags
      parameters:
      - in: path
        name: version
        required: true
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: server
        schema:
          type: string
      - in: query
        name: mostUsedGFlags
        schema:
          default: false
          type: boolean
      - in: query
        name: showExperimental
        schema:
          default: false
