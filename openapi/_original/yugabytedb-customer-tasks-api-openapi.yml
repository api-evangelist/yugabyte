      description: 'Deprecated since YBA version 2.19.1.0.

        Use /api/v1/customers/{cUUID}/tasks/{tUUID}/failed_subtasks instead.'
      operationId: failedSubtasks
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  properties: {}
                  type: object
                type: object
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Fetch failed subtasks - deprecated
      tags:
      - Customer Tasks
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks/{tUUID}/failed_subtasks:
    get:
      operationId: listFailedSubtasks
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedSubtasks'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get a list of task's failed subtasks
      tags:
      - Customer Tasks
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks/{tUUID}/retry:
    post:
      description: Retry a Universe or Provider task.
      operationId: retryTask
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Retry a Universe or Provider task
      tags:
      - Customer Tasks
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks/{tUUID}/rollback:
    post:
      description: Rollback a Universe or Provider task.
      operationId: rollbackTask
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: tUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Rollback a Universe or Provider task
      tags:
      - Customer Tasks
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks_list:
    get:
