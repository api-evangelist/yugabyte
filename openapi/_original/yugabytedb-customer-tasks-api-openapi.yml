          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List task
      tags:
      - Customer Tasks
    servers:
    - url: /
  /api/v1/customers/{cUUID}/tasks_list/page:
    post:
      description: 'WARNING: This is a preview API that could change.'
      operationId: listTasksV2
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPagedApiQuery'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPagedApiResponse'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List Tasks (paginated)
      tags:
      - Customer Tasks
      x-codegen-request-body-name: PageTasksRequest
    servers:
    - url: /
